<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>Markus AI</title>
<style>
  :root { --bg:#070b16; --text:#e8ecf8; --muted:#8b93a7; --accent:#7c83ff; --accent2:#a855f7; --line:rgba(255,255,255,.08); --glass:rgba(255,255,255,.05); }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); overflow:hidden; -webkit-font-smoothing:antialiased; }
  button { font-family:inherit; cursor:pointer; }

  .orb { position:fixed; border-radius:50%; filter:blur(90px); opacity:.4; pointer-events:none; z-index:0; animation:float 18s ease-in-out infinite; }
  .o1 { width:380px; height:380px; background:#4f46e5; top:-130px; left:-90px; }
  .o2 { width:340px; height:340px; background:#0ea5e9; bottom:-130px; right:-70px; animation-delay:-6s; }
  .o3 { width:260px; height:260px; background:#a855f7; top:40%; left:55%; opacity:.25; animation-delay:-11s; }
  @keyframes float { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(45px,30px) scale(1.08); } }

  .app { position:relative; z-index:1; max-width:760px; height:100vh; height:100dvh; margin:0 auto; display:flex; flex-direction:column; }

  header { display:flex; align-items:center; gap:12px; padding:14px 18px; background:rgba(10,15,30,.55); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-bottom:1px solid var(--line); animation:fadeDown .6s ease both; }
  @keyframes fadeDown { from { opacity:0; transform:translateY(-12px); } to { opacity:1; transform:none; } }
  .avatar { width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent2)); display:flex; align-items:center; justify-content:center; font-size:19px; flex:none; position:relative; box-shadow:0 4px 18px rgba(124,131,255,.35); }
  .avatar.sm { width:30px; height:30px; font-size:14px; box-shadow:none; }
  .dot { position:absolute; right:-1px; bottom:-1px; width:11px; height:11px; border-radius:50%; background:#22c55e; border:2px solid #0b1020; }
  .dot::after { content:""; position:absolute; inset:-2px; border-radius:50%; border:2px solid #22c55e; animation:pulse 2s ease-out infinite; }
  @keyframes pulse { from { opacity:.8; transform:scale(1); } to { opacity:0; transform:scale(2.2); } }
  .title { font-weight:600; font-size:16px; letter-spacing:.2px; }
  .status { font-size:12px; color:var(--muted); font-weight:400; margin-top:1px; }
  #auth { margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; }
  #auth .who { color:var(--muted); max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ghost { padding:7px 14px; font-size:12.5px; color:var(--text); background:var(--glass); border:1px solid var(--line); border-radius:999px; transition:background .2s, border-color .2s, transform .15s; }
  .ghost:hover { background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.2); }
  .ghost:active { transform:scale(.96); }

  .notice { display:flex; align-items:flex-start; gap:10px; margin:10px 14px 0; padding:8px 12px; font-size:12px; line-height:1.4; color:var(--muted); background:var(--glass); border:1px solid var(--line); border-radius:12px; animation:rise .6s .2s ease both; }
  .notice button { margin-left:auto; border:0; background:none; color:var(--muted); font-size:18px; line-height:1; padding:0 2px; }
  .notice button:hover { color:var(--text); }

  #chat { flex:1; overflow-y:auto; padding:18px 14px 8px; display:flex; flex-direction:column; gap:5px; scroll-behavior:smooth; }
  #chat::-webkit-scrollbar { width:6px; }
  #chat::-webkit-scrollbar-thumb { background:rgba(255,255,255,.12); border-radius:6px; }
  .row { display:flex; align-items:flex-end; gap:8px; }
  .row.me { justify-content:flex-end; }
  .sp { width:30px; flex:none; }
  .bubble { max-width:80%; padding:9px 14px; border-radius:18px; font-size:15px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word; }
  .bot .bubble { background:var(--glass); border:1px solid var(--line); border-bottom-left-radius:6px; backdrop-filter:blur(10px); animation:popL .35s cubic-bezier(.2,.9,.3,1.2) both; }
  .me .bubble { background:linear-gradient(135deg,#5b61f0,#8b4df0); border-bottom-right-radius:6px; box-shadow:0 6px 20px rgba(99,102,241,.3); animation:popR .35s cubic-bezier(.2,.9,.3,1.2) both; }
  @keyframes popL { from { opacity:0; transform:translate(-10px,8px) scale(.94); } to { opacity:1; transform:none; } }
  @keyframes popR { from { opacity:0; transform:translate(10px,8px) scale(.94); } to { opacity:1; transform:none; } }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }

  .dots { display:flex; gap:5px; padding:13px 15px; }
  .dots i { width:7px; height:7px; border-radius:50%; background:var(--muted); animation:bounce 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay:.15s; }
  .dots i:nth-child(3) { animation-delay:.3s; }
  @keyframes bounce { 0%,60%,100% { transform:translateY(0); opacity:.5; } 30% { transform:translateY(-6px); opacity:1; } }

  .hero { margin:auto; text-align:center; padding:20px; animation:rise .7s ease both; }
  .hero-avatar { width:76px; height:76px; margin:0 auto 18px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent2)); display:flex; align-items:center; justify-content:center; font-size:34px; box-shadow:0 10px 40px rgba(124,131,255,.45); animation:bob 4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
  .hero h1 { margin:0 0 6px; font-size:28px; letter-spacing:.3px; background:linear-gradient(90deg,#c7caff,#e9c8ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero p { margin:0 0 22px; color:var(--muted); font-size:15px; }
  .chips { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .chip { padding:10px 16px; font-size:13.5px; color:var(--text); background:var(--glass); border:1px solid var(--line); border-radius:999px; animation:rise .6s ease both; transition:transform .2s, background .2s, border-color .2s; }
  .chip:hover { transform:translateY(-2px); background:rgba(124,131,255,.15); border-color:rgba(124,131,255,.5); }

  .composer { display:flex; align-items:center; gap:10px; margin:6px 14px 4px; padding:7px 7px 7px 20px; border-radius:999px; background:rgba(255,255,255,.06); border:1px solid var(--line); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); transition:border-color .2s, box-shadow .2s; }
  .composer:focus-within { border-color:rgba(124,131,255,.65); box-shadow:0 0 0 4px rgba(124,131,255,.15); }
  #input { flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--text); font:inherit; font-size:16px; padding:8px 0; }
  #input::placeholder { color:var(--muted); }
  #send { width:42px; height:42px; border:0; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 6px 18px rgba(124,131,255,.4); transition:transform .18s, box-shadow .18s, opacity .2s; }
  #send:hover { transform:scale(1.08) rotate(-6deg); box-shadow:0 8px 24px rgba(124,131,255,.6); }
  #send:active { transform:scale(.92); }
  #send:disabled { opacity:.45; transform:none; cursor:default; }
  .foot { height:30px; flex:none; padding-bottom:env(safe-area-inset-bottom,0px); }

  .version { position:fixed; right:14px; bottom:calc(8px + env(safe-area-inset-bottom,0px)); z-index:5; padding:3px 10px; font-size:11px; letter-spacing:.4px; color:var(--muted); background:rgba(10,15,30,.6); border:1px solid var(--line); border-radius:999px; backdrop-filter:blur(8px); animation:rise .8s .4s ease both; user-select:none; }

  .toast { position:fixed; left:50%; bottom:96px; z-index:10; transform:translate(-50%,16px); opacity:0; pointer-events:none; padding:10px 18px; font-size:13.5px; background:rgba(30,20,40,.92); border:1px solid rgba(255,120,140,.4); border-radius:12px; transition:opacity .3s, transform .3s; }
  .toast.show { opacity:1; transform:translate(-50%,0); }

  @media (max-width:520px) { .hero h1 { font-size:24px; } #auth .who { display:none; } }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

<div class="app">
  <header>
    <div class="avatar">⚡<span class="dot"></span></div>
    <div>
      <div class="title">Markus AI</div>
      <div class="status">Prisijungęs</div>
    </div>
    <div id="auth"></div>
  </header>
  <div class="notice" id="notice">
    <span>Markus AI yra draugų pokštas ir dirbtinio intelekto parodija, ne tikras Markus. Pokalbiai saugomi ir matomi kūrėjui, kad botas būtų tobulinamas. Neįrašyk asmeninių duomenų ar slaptažodžių. Prisijungus su Google, pokalbiai išlieka tavo paskyroje.</span>
    <button type="button" id="closeNotice" aria-label="Uždaryti">×</button>
  </div>
  <div id="chat"></div>
  <form id="form" class="composer" autocomplete="off">
    <input id="input" type="text" placeholder="Parašyk žinutę…" maxlength="2000" aria-label="Žinutė">
    <button id="send" type="submit" aria-label="Siųsti">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
    </button>
  </form>
  <div class="foot"></div>
</div>

<div class="version" id="version" title="Versija"></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  const APP_VERSION = 'Beta v0.5.0';
  const $ = (id) => document.getElementById(id);
  const chat = $('chat'), form = $('form'), input = $('input'), send = $('send'), authBox = $('auth'), toastEl = $('toast');
  const history = [];
  $('version').textContent = APP_VERSION;

  try { if (localStorage.getItem('noticeClosed')) $('notice').remove(); } catch (e) {}
  $('closeNotice').onclick = () => { $('notice').remove(); try { localStorage.setItem('noticeClosed', '1'); } catch (e) {} };

  let sessionId;
  try {
    sessionId = localStorage.getItem('sid');
    if (!sessionId) { sessionId = crypto.randomUUID(); localStorage.setItem('sid', sessionId); }
  } catch (e) { sessionId = 'anon-' + Math.random().toString(36).slice(2); }

  let sb = null, accessToken = null, loadedFor = null, toastTimer;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const scrollDown = () => chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3500);
  }

  function splitReply(text) {
    return text.split(/^\s*---\s*$/m).map((s) => s.trim()).filter(Boolean).slice(0, 10);
  }

  const SUGGESTIONS = ['Paaiškink paprastai, kaip veikia internetas', 'Papasakok kokį pokštą', 'Padėk išspręsti uždavinį'];

  function showHero() {
    if (chat.querySelector('.hero')) return;
    const h = document.createElement('div');
    h.className = 'hero';
    h.innerHTML = '<div class="hero-avatar">⚡</div><h1>Markus AI</h1><p>Klausk bet ko arba tiesiog pasikalbėk.</p><div class="chips"></div>';
    const c = h.querySelector('.chips');
    SUGGESTIONS.forEach((t, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = t;
      b.style.animationDelay = (0.25 + i * 0.1) + 's';
      b.onclick = () => { input.value = t; form.requestSubmit(); };
      c.appendChild(b);
    });
    chat.appendChild(h);
  }

  function addBubble(text, who) {
    const h = chat.querySelector('.hero');
    if (h) h.remove();
    const row = document.createElement('div');
    row.className = 'row ' + who;
    if (who === 'bot') {
      const last = chat.lastElementChild;
      if (last && last.classList.contains('bot')) {
        const sp = document.createElement('div'); sp.className = 'sp'; row.appendChild(sp);
      } else {
        const av = document.createElement('div'); av.className = 'avatar sm'; av.textContent = '⚡'; row.appendChild(av);
      }
    }
    const b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;
    row.appendChild(b);
    chat.appendChild(row);
    scrollDown();
  }

  function setTyping(on) {
    let t = $('typing');
    if (on && !t) {
      t = document.createElement('div');
      t.id = 'typing'; t.className = 'row bot';
      t.innerHTML = '<div class="avatar sm">⚡</div><div class="bubble dots"><i></i><i></i><i></i></div>';
      chat.appendChild(t);
      scrollDown();
    } else if (!on && t) { t.remove(); }
  }

  // ---------- Prisijungimas (neprivalomas) ----------
  function renderAuth(session) {
    authBox.innerHTML = '';
    if (!sb) return;
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'ghost';
    if (session) {
      const who = document.createElement('span');
      who.className = 'who';
      who.textContent = (session.user && session.user.email) || 'Prisijungta';
      btn.textContent = 'Atsijungti';
      btn.onclick = () => sb.auth.signOut();
      authBox.appendChild(who);
    } else {
      btn.textContent = 'Prisijungti su Google';
      btn.onclick = () => sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin } });
    }
    authBox.appendChild(btn);
  }

  async function loadHistory(uid) {
    try {
      const { data, error } = await sb.from('messages').select('role,content').eq('user_id', uid).order('id', { ascending: false }).limit(60);
      if (error || !data) return;
      data.reverse();
      chat.innerHTML = '';
      history.length = 0;
      data.forEach((m) => {
        if (m.role === 'user') { addBubble(m.content, 'me'); history.push({ role: 'user', text: m.content }); }
        else { splitReply(m.content).forEach((t) => addBubble(t, 'bot')); history.push({ role: 'assistant', text: m.content }); }
      });
      if (!data.length) showHero();
    } catch (e) {}
  }

  function applySession(session) {
    accessToken = session ? session.access_token : null;
    renderAuth(session);
    const uid = session && session.user ? session.user.id : null;
    if (uid && loadedFor !== uid) { loadedFor = uid; setTimeout(() => loadHistory(uid), 0); }
    if (!uid && loadedFor) { loadedFor = null; chat.innerHTML = ''; history.length = 0; showHero(); }
  }

  async function initAuth() {
    try {
      if (!window.supabase) return;
      const cfg = await (await fetch('/api/config')).json();
      if (!cfg.url || !cfg.anonKey) return;
      sb = window.supabase.createClient(cfg.url, cfg.anonKey);
      sb.auth.onAuthStateChange((event, session) => applySession(session));
      const { data } = await sb.auth.getSession();
      applySession(data.session);
    } catch (e) {}
  }

  // ---------- Žinučių siuntimas ----------
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || send.disabled) return;
    input.value = '';
    addBubble(text, 'me');
    history.push({ role: 'user', text });
    send.disabled = true;
    setTyping(true);
    try {
      const headers = { 'Content-Type': 'application/json' };
      if (accessToken) headers.Authorization = 'Bearer ' + accessToken;
      const r = await fetch('/api/chat', { method: 'POST', headers, body: JSON.stringify({ messages: history, sessionId }) });
      const data = await r.json().catch(() => ({}));
      if (r.status === 429) throw new Error('rate');
      if (!r.ok) throw new Error(data.error || 'klaida');
      const lines = splitReply(data.reply);
      history.push({ role: 'assistant', text: lines.join('\n---\n') });
      for (let i = 0; i < lines.length; i++) {
        setTyping(true);
        await sleep(300 + Math.min(lines[i].length * 6, 1200));
        setTyping(false);
        addBubble(lines[i], 'bot');
      }
    } catch (err) {
      setTyping(false);
      history.pop();
      toast(err.message === 'rate' ? 'Per greitai. Palauk akimirką ir bandyk dar kartą.' : 'Nepavyko gauti atsakymo. Bandyk dar kartą.');
    }
    send.disabled = false;
    input.focus();
  });

  showHero();
  initAuth();
</script>
</body>
</html>
